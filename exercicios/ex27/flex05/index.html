<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(171, 170, 170);
        }

        main {
            background-color: white;
            height: 90vh;
            width: 100vw;
            display: flex;
            flex-flow: row wrap;
            align-items: center;
            justify-content: center;
        }

        section {
            background-color: aqua;
            padding: 10px;
            width: 500px;
            text-align: center;
            height: 500px;
        }

        h1 {
            margin-top: 200px;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Faça Login</h1>
        </section>
    </main>
</body>
</html>
