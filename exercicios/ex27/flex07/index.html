<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container {
            background-color: rgb(93, 136, 8);
            display: flex;
            flex-flow: row nowrap;
            justify-content: center; /* padrão */
            align-content: flex-start;
            align-items: center;
            height: 600px;
        }

        .item {
            background-color: red;
            border: 1px solid black;
            text-align: center;
            padding: 40px;
        }

        #i1 {
            order: -4;
        }

        #i2 {
            order: 9;
        }

        #i3 {
            order: -3;
        }

        #i4 {
            order: -10;
        }

        #i5 {
            order: 10;
        }

        #i6 {
            order: 6;
        }

        #i7 {
            order: 15;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
