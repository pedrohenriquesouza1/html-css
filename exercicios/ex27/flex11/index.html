<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container {
            background-color: rgb(93, 136, 8);
            display: flex;
            flex-flow: row nowrap;
        }

        .item {
            background-color: red;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
            flex-shrink: 0;
            flex-grow: 0;
        }

        .item:nth-child(1) {
            flex-shrink: 0;
            flex-grow: 1;
        }

        .item:nth-child(2) {
            flex-shrink: 0;
            flex-grow: 1;
        }

        .item:nth-child(3) {
            flex-shrink: 2;
            flex-grow: 1;    
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
</body>
</html>
