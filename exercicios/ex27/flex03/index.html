<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container {
            background-color: aqua;
            display: flex;
            flex-flow: row wrap;
        }

        .item {
            background-color: red;
            border: 1px solid black;
            text-align: center;
            flex: auto;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Exemplo bloco  A</div>
        <div class="item">Exemplo bloco  B</div>
        <div class="item">Exemplo bloco  C</div>
        <div class="item">Exemplo bloco  D</div>
        <div class="item">Exemplo bloco  E</div>
        <div class="item">Exemplo bloco  F</div>
        <div class="item">Exemplo bloco  G</div>
    </div>
</body>
</html>
