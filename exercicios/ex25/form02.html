<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de usuário</title>
</head>
<body>
    <h1>Formulário/ insira sua senha</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iusu">Usuário:</label>
            <input type="text" name="usu" id="iusu" required size="15" maxlength="15" autocomplete="username">
        </p>
        <p>
            <label for="isenha">Senha:</label>
            <input type="password" name="senha" id="isenha" required size="8" maxlength="8"> 
        </p>
        <p>
            <input type="submit" value="enviar resposta">
        </p>
        <p>
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
