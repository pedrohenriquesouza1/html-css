<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Formulário</title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="inum">Número: </label>
            <input type="range" name="num" id="inum" required min="0" max="10" value="5" oninput="ival.innerHTML = Number(inum.value)">
            <output id="ival">

            </output>
        </p>
    </form>
</body>
</html>
