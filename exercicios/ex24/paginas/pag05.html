<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
</head>
<body>
    <h1>Links</h1>
    <a href="#" onclick="clicou()">aperte aqui</a>
    <div id="saida"></div>




    <script>
        function clicou() {
            s = window.document.getElementById("saida")  
            s.innerHTML += '<p> você clicou!</p>'
        }
    </script>
</body>
</html>
