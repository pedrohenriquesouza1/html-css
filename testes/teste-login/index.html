<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css">
   <link rel="stylesheet" href="estilos/devices.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem"> 
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                <form action="login.php" method="post" autocomplete="on">
                    <div class="campo">
                        <span class="material-icons">account_circle</span>
                        <input type="email" name="login" id="ilogin" placeholder="seu e-mail" autocomplete="email" required maxlength="30">
                        <label for="ilogin">Login</label>
                    </div>
                    <div class="campo">
                        <span class="material-icons">key</span>
                        <input type="password" name="senha" id="isenha" placeholder="sua senha" autocomplete="current-password" required minlength="8" maxlength="16">
                        <label for="isenha">Senha</label>
                    </div>
                    <input type="submit" value="Login" class="botao">
                        <div> 
                            <a href="forgot.html" class="botao">
                                Esqueci a senha <i class="material-icons">lock_reset</i>
                            </a>
                        </div>
                        <div class="cadastro">
                            <a href="singin.html">
                                Cadastro
                                <span class="material-icons">person_add</span>
                            </a> 
                        </div>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <p>Projeto feito por Pedro Henrique</p>
    </footer>
</body>
</html>
