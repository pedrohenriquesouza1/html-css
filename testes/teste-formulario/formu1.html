<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Formulário /01</h1>
    <form action="form.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Login</legend>
            <p>
                <label for="nome">Nome:</label>
                <input type="text" name="nome" id="nome" autocomplete="username" size="15" maxlength="15" placeholder="Nome de usuário" required>
            </p>
            <div>
                <label for="senha">Senha:</label>
                <input type="password" name="senha" id="senha" placeholder="senha" required size="15" minlength="8" maxlength="16">
            </div>
        </fieldset>
        <div>
            <label for="note">Notas:</label>
            <input type="number" name="note" id="nota" step="any">
        </div>
          <fieldset>
            <legend>Sexo</legend>
              <div>
                <input type="radio" name="sexo" id="sxfem" required value="F"> <label for="sxfem">Feminino</label>
                <input type="radio" name="sexo" id="sxmas" required value="M"> <label for="sxmas">Masculino</label>
              </div>
          </fieldset>
            <label for="mail">E-mail:</label>
            <input type="mail" name="mail" id="email" maxlength="30" size="30" required>
        </p>
        <p>
            <label for="tel">Telefone</label>
            <input type="tel" name="telefone" id="tel" maxlength="15" pattern="\(\d{2}\)\s?\d{4,5}-\d{4}"placeholder="(11) 91234-5678">
        </p>
        <p>
            <label for="num1">Número 1: </label>
            <input type="number" name="num" id="num1" required placeholder="Escreva um número aqui" oninput="total.innerHTML = Number(num1.value) + Number(num2.value)">
        </p>
        <p>
            <label for="num2">Número2: </label>
            <input type="number" name="num" id="num2" placeholder="Escreva um número aqui" oninput="total.innerHTML = Number(num1.value) + Number(num2.value)" required>
        </p>
        <p>
            <output id="total">
                0
            </output>
        </p>
        
            <div>
                <textarea name="msg" id="msg" cols="50" rows="20" placeholder="Digite sua mensagem aqui..."></textarea>
            </div>
        <!--Placeholder funcionando--> 
        <div>
            <div>
                <label for="brr">Nível de experiência</label>
                <input type="range" name="barra" id="brr" required min="0" max="10" oninput="result.innerHTML = Number(brr.value)">
                <output id="result">5</output>
            </div>
            <input type="submit" value="entrar" class="button" style="margin-top: 10px;">
        </div>
        <div>
            <input type="reset" value="apagar dados" class="button">
        </div>
    </form>
</body>
</html>
